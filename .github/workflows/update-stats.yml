name: update-stats

on:
  schedule:
    - cron: '0 6 * * 1'   # раз в неделю, понедельник 06:00 UTC
  workflow_dispatch:       # + кнопка ручного запуска

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: node index.js
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}

      - name: Commit and push stats.json
        run: |
          git config user.name "bears-bot"
          git config user.email "bears-bot@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || (git commit -m "stats: update" && git push)
